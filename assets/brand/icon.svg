<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Midnight Obsidian) -->
    <linearGradient id="bg_3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161326"/>
      <stop offset="50%" stop-color="#0B0A12"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <!-- Studio Radial Aura (Violet & Cyan bounce light) -->
    <radialGradient id="studioAura" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#5027DE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Back Glass Card (Frosted Cyan & Mint Refraction) -->
    <linearGradient id="backCardGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2FD98A"/>
    </linearGradient>

    <!-- Front Card 3D Body: Rich Multi-stop Violet to Deep Indigo -->
    <linearGradient id="cardFront3D" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A27BFF"/>
      <stop offset="25%" stop-color="#8054FF"/>
      <stop offset="65%" stop-color="#5B2BE8"/>
      <stop offset="100%" stop-color="#3C13B0"/>
    </linearGradient>

    <!-- 3D Card Extruded Thickness Edge (Darker Ambient Occlusion) -->
    <linearGradient id="cardEdge3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F26D9"/>
      <stop offset="100%" stop-color="#21086C"/>
    </linearGradient>

    <!-- Specular Gloss Highlight (Top-left glass reflection) -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.25"/>
    </linearGradient>

    <!-- 3D Sol Symbol Chrome / Platinum Gradient -->
    <linearGradient id="solChrome3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F2EEFF"/>
      <stop offset="70%" stop-color="#D4C4FF"/>
      <stop offset="100%" stop-color="#9E82FF"/>
    </linearGradient>

    <!-- 3D Sol Bevel Under-edge -->
    <linearGradient id="solUnderEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#321288"/>
      <stop offset="100%" stop-color="#1B0652"/>
    </linearGradient>

    <!-- Neon Cyan 3D Slash Gradient -->
    <linearGradient id="slashCyan3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 3D Mint Glow Token -->
    <radialGradient id="mintToken" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="45%" stop-color="#2FD98A"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- Drop Shadows for 3D Floating Depths -->
    <filter id="shadowUnderCard" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6F40F7" flood-opacity="0.45"/>
    </filter>

    <filter id="sol3DShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#1B0652" flood-opacity="0.75"/>
    </filter>

    <filter id="glow3D" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg_3d)"/>
  <rect width="512" height="512" rx="116" fill="url(#studioAura)"/>
  
  <!-- Outer Luxury Rim -->
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Centered Scaled 3D Composition (Safe-zone 0.82) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">

    <!-- LAYER 1: BACK FROSTED GLASS CARD (Tilted Right +10 deg, Cyan/Mint Glass) -->
    <g transform="rotate(10 256 256) translate(22 -6)">
      <!-- Soft ambient shadow cast by back card -->
      <path d="M 160 84 C 160 62, 178 44, 200 44 L 312 44 C 334 44, 352 62, 352 84 L 352 414 Q 338 424 324 414 Q 310 424 296 414 Q 282 424 268 414 Q 254 424 240 414 Q 226 424 212 414 Q 198 424 184 414 Q 172 420 160 414 Z"
            fill="#000000" opacity="0.4" transform="translate(0, 16) scale(0.98)"/>
      
      <!-- Back Card Glass Body -->
      <path d="M 160 84 C 160 62, 178 44, 200 44 L 312 44 C 334 44, 352 62, 352 84 L 352 414 Q 338 424 324 414 Q 310 424 296 414 Q 282 424 268 414 Q 254 424 240 414 Q 226 424 212 414 Q 198 424 184 414 Q 172 420 160 414 Z"
            fill="url(#backCardGrad3D)" opacity="0.82"/>

      <!-- Inner Glass Refraction Stroke -->
      <path d="M 162 86 C 162 66, 178 50, 198 50 L 314 50 C 334 50, 350 66, 350 86 L 350 410"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    </g>

    <!-- LAYER 2: FRONT MAIN 3D TICKET (Tilted Left -5 deg, Electric Violet with 3D Depth) -->
    <g transform="rotate(-5 256 256) translate(-2 -2)" filter="url(#shadowUnderCard)">

      <!-- 3D Extruded Depth Side & Bottom (Simulates ~12px physical card thickness) -->
      <path d="M 154 86 L 154 424 
               Q 168 434 182 424 Q 196 434 210 424 Q 224 434 238 424 Q 252 434 266 424 Q 280 434 294 424 Q 308 434 322 424 Q 336 434 350 424 Q 356 427 364 422 
               L 364 88 
               L 358 80 
               L 358 416 
               Q 344 426 330 416 Q 316 426 302 416 Q 288 426 274 416 Q 260 426 246 416 Q 232 426 218 416 Q 204 426 190 416 Q 176 426 162 416 L 154 412 Z"
            fill="url(#cardEdge3D)"/>

      <!-- Front Ticket Face (Claymorphic / Glossy violet face) -->
      <path d="M 154 82 
               C 154 60, 174 42, 198 42 
               L 314 42 
               C 338 42, 358 60, 358 82 
               L 358 416 
               Q 344 426 330 416 
               Q 316 426 302 416 
               Q 288 426 274 416 
               Q 260 426 246 416 
               Q 232 426 218 416 
               Q 204 426 190 416 
               Q 176 426 162 416 
               L 154 412 
               Z"
            fill="url(#cardFront3D)"/>

      <!-- Curved Gloss Reflection (Glassmorphic shine) -->
      <path d="M 156 82 
               C 156 62, 174 44, 198 44 
               L 314 44 
               C 338 44, 356 62, 356 82 
               L 356 180 
               C 270 200, 200 130, 156 160 
               Z"
            fill="url(#glossHighlight)" opacity="0.55"/>

      <!-- Specular Perimeter Rim Light -->
      <path d="M 154 82 
               C 154 60, 174 42, 198 42 
               L 314 42 
               C 338 42, 358 60, 358 82 
               L 358 416"
            fill="none" stroke="url(#glossHighlight)" stroke-width="2.8"/>

      <!-- 3D Contactless Radar Waves (Top Right) -->
      <g transform="translate(320, 74) scale(0.74)" stroke="#22D3EE" fill="none" stroke-linecap="round" stroke-width="5" filter="url(#glow3D)">
        <path d="M 0 0 A 18 18 0 0 1 0 28" opacity="0.95"/>
        <path d="M 9 -7 A 30 30 0 0 1 9 35" opacity="0.6"/>
        <circle cx="-12" cy="14" r="4.5" fill="#22D3EE"/>
      </g>

      <!-- 3D EMBOSSED PERUVIAN SOL SYMBOL (S/) -->
      <g id="sol3DGroup" transform="translate(194, 108)" filter="url(#sol3DShadow)">
        
        <!-- 'S' Cast Drop Shadow -->
        <path d="M 56 16 C 52 8, 42 4, 30 4 C 14 4, 2 14, 2 30 C 2 48, 20 53, 36 58 C 52 63, 60 70, 60 82 C 60 98, 46 108, 28 108 C 12 108, 1 97, 0 84" 
              fill="none" stroke="#220B5E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(1, 4)"/>

        <!-- 'S' Main Beveled Chrome Body -->
        <path d="M 56 12 C 52 4, 42 0, 30 0 C 14 0, 2 10, 2 26 C 2 44, 20 49, 36 54 C 52 59, 60 66, 60 78 C 60 94, 46 104, 28 104 C 12 104, 1 93, 0 80" 
              fill="none" stroke="url(#solChrome3D)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 'S' Specular Top Rim Highlight -->
        <path d="M 54 11 C 50 3, 40 0, 30 0 C 14 0, 3 9, 3 24 C 3 34, 12 40, 22 44" 
              fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

        <!-- 3D Slash '/' (Neon Cyan Beam) -->
        <line x1="83" y1="-5" x2="59" y2="117" stroke="#160844" stroke-width="13" stroke-linecap="round" transform="translate(1, 4)"/>
        <line x1="82" y1="-8" x2="58" y2="114" stroke="url(#slashCyan3D)" stroke-width="12" stroke-linecap="round"/>
        <line x1="81" y1="-7" x2="68" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

        <!-- 3D Glowing Mint Sphere / Coin Dot -->
        <circle cx="94" cy="103" r="8" fill="#1B0652" transform="translate(1, 3)"/>
        <circle cx="94" cy="101" r="7.5" fill="url(#mintToken)" filter="url(#glow3D)"/>
        <circle cx="92" cy="99" r="2.5" fill="#FFFFFF"/>
      </g>

      <!-- 3D Embossed Balance Pill (Cyan glow bar with glass bevel) -->
      <g transform="translate(184, 276)">
        <!-- Shadow beneath the pill -->
        <rect x="0" y="4" width="144" height="18" rx="9" fill="#1C0954" opacity="0.6"/>
        
        <!-- Glowing Pill Body -->
        <rect x="0" y="0" width="144" height="18" rx="9" fill="url(#slashCyan3D)" filter="url(#glow3D)"/>
        
        <!-- Specular Highlight Stripe on Pill -->
        <rect x="4" y="2" width="136" height="4" rx="2" fill="#FFFFFF" opacity="0.75"/>
      </g>

      <!-- Embossed Transaction Bars -->
      <rect x="184" y="316" width="112" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>
      <rect x="184" y="340" width="80" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>
    </g>
  </g>
</svg>